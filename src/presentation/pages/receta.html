<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear receta</title>

    <link rel="stylesheet" href="../styles/receta.css">
</head>

<body>

    <main>

        <h1>Crear receta de platillo</h1>

        <section class="recipe-builder">

            <h2>Datos de la receta</h2>

            <div>
                <label for="platoId">ID del platillo:</label>

                <input
                    type="number"
                    id="platoId"
                    min="1"
                    required
                >
            </div>

            <br>

            <h2>Agregar ingrediente</h2>

            <div class="ingredient-search">

                <div>
                    <label for="ingredienteId">ID del ingrediente:</label>

                    <input
                        type="number"
                        id="ingredienteId"
                        min="1"
                        required
                    >
                </div>

                <div>
                    <label for="cantidad">Cantidad:</label>

                    <input
                        type="number"
                        id="cantidad"
                        min="0.001"
                        step="0.001"
                        required
                    >
                </div>

                <div>
                    <label for="unidad">Unidad:</label>

                    <select id="unidad">
                        <option value="gramos">Gramos</option>
                        <option value="kilogramos">Kilogramos</option>
                        <option value="mililitros">Mililitros</option>
                        <option value="litros">Litros</option>
                        <option value="unidades">Unidades</option>
                    </select>
                </div>

                <button type="button" id="agregarIngrediente">
                    Agregar ingrediente
                </button>

            </div>

            <h2>Ingredientes de la receta</h2>

            <ul
                id="listaIngredientes"
                class="recipe-ingredients-list"
            >
            </ul>

            <p>
                <strong>Costo total:</strong>
                $<span id="costoTotal">0.00</span>
            </p>

            <button type="button" id="guardarReceta">
                Guardar receta
            </button>

            <p id="mensaje"></p>

        </section>

    </main>

    <script
        type="module"
        src="../components/receta.js">
    </script>

</body>
</html>
